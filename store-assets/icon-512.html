<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 512px; height: 512px; overflow: hidden; }
</style>
</head>
<body>
<!--
  Play store icon: 512x512, full-bleed, opaque (Play applies its own rounded mask).
  viewBox 18..90 is exactly the 72dp visible area of the 108dp adaptive icon,
  so this reproduces what users see on their launcher.
  Glyph paths copied verbatim from app/src/main/res/drawable/ic_launcher_foreground.xml
-->
<svg width="512" height="512" viewBox="18 18 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5C68E0"/>
      <stop offset="100%" stop-color="#4550C4"/>
    </linearGradient>
  </defs>

  <rect x="18" y="18" width="72" height="72" fill="url(#bg)"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="4.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M36,41 l5,5 l9,-11"/>
    <path d="M58,40 h16"/>
    <path d="M36,60 l5,5 l9,-11"/>
    <path d="M58,59 h16"/>
    <path d="M36,79 h6"   stroke-opacity="0.55"/>
    <path d="M58,79 h16"  stroke-opacity="0.55"/>
  </g>
</svg>
</body>
</html>
